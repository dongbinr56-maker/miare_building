name: Refresh listings

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Cloudflare refresh job ID
        required: true
        type: string
      seed_state:
        description: Seed a pending KV state for a manual end-to-end test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# At most one collector may run at a time. A second request waits instead of
# cancelling a collection that may already be ready to publish.
concurrency:
  group: listing-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REFRESH_JOB_ID: ${{ inputs.job_id }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate cloud credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare collector credentials are not configured."
            exit 1
          fi

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r collector/requirements.txt

      - name: Install Wrangler
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Seed manual refresh state
        if: ${{ inputs.seed_state }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          from refresh_agent import DEFAULT_NAMESPACE_ID, KvClient

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          KvClient(DEFAULT_NAMESPACE_ID).put_json("refresh:state", {
              "jobId": os.environ["REFRESH_JOB_ID"],
              "status": "pending",
              "requestedAt": now,
              "message": "Manual end-to-end refresh is waiting.",
          })
          PY

      - name: Collect and publish listings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The same narrowly scoped token authenticates the Browser Run CDP
          # connection. It is never exposed to dependency installation steps.
          CLOUDFLARE_BROWSER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python refresh_agent.py --once --job-id "$REFRESH_JOB_ID"

      - name: Show collector summary
        if: always()
        shell: bash
        run: |
          if [ -f collector/last_manual_refresh.log ]; then
            tail -n 60 collector/last_manual_refresh.log
          else
            echo "Collector log was not created."
          fi
