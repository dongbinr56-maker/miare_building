name: Deploy production Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate cloud credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare deployment credentials are not configured."
            exit 1
          fi

      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Run web tests
        working-directory: web
        run: |
          node --experimental-strip-types --test tests/map-utils.test.ts
          node --experimental-strip-types --test functions/tests/*.test.mjs

      - name: Lint and build
        working-directory: web
        run: |
          npm run lint
          npm run build

      - name: Reject bundled live listing data
        shell: bash
        run: |
          if [ -f web/public/data/listings.json ] || [ -f web/dist/data/listings.json ]; then
            echo "::error::Live listing data must be delivered from protected KV, not bundled into Pages."
            exit 1
          fi

      - name: Deploy production Pages
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler pages deploy dist
          --project-name snapspot-studio-finder
          --branch main
          --commit-hash "$GITHUB_SHA"
